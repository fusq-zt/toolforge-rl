[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolforge-rl"
version = "0.1.0"
description = "Data-centric tool reasoning with executable trajectories and efficient GRPO"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

